// carte.js : carte Leaflet + OpenStreetMap des circuits (utilisée sur l'accueil et la page Circuits)
function echapper(texte) {
    return String(texte == null ? '' : texte).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

// circuits : tableau d'objets {id, nom, ville, pays, lat, lng}
function creerCarte(idElement, circuits, options) {
    options = options || {};
    var carte = L.map(idElement, { scrollWheelZoom: !!options.molette, worldCopyJump: true, minZoom: 1, zoomSnap: 0.25 }).setView([25, 10], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(carte);

    var groupe = L.featureGroup().addTo(carte);
    var reperes = {};

    function afficher(liste) {
        groupe.clearLayers();
        reperes = {};
        liste.forEach(function (c) {
            if (c.lat === null || c.lng === null) { return; }
            var m = L.circleMarker([c.lat, c.lng], {
                radius: options.rayon || 6, color: '#ffffff', weight: 1.5, fillColor: '#d90b00', fillOpacity: 0.95
            });
            m.bindPopup('<strong>' + echapper(c.nom) + '</strong><br>' + echapper(c.ville) + ', ' + echapper(c.pays));
            m.addTo(groupe);
            reperes[c.id] = m;
        });
        if (groupe.getLayers().length > 0) {
            carte.fitBounds(groupe.getBounds(), { padding: [30, 30], maxZoom: 6 });
        }
    }

    function ouvrir(id) {
        var m = reperes[id];
        if (!m) { return; }
        carte.flyTo(m.getLatLng(), Math.max(carte.getZoom(), 7));
        m.openPopup();
    }

    afficher(circuits);
    return { carte: carte, afficher: afficher, ouvrir: ouvrir };
}
